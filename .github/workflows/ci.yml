name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: togavsu_lawpay_docuseal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      # The superuser URL. The fake-core suite uses this database; the coretest suite
      # (acceptance/) creates and drops its own databases from it.
      TOGAVSU_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/togavsu_lawpay_docuseal?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -timeout 0 ./...
      # The core's own check of the package dir, as the marketplace checks it: the parts
      # package/pending.yaml lists that the pinned core refuses held back, and (-strict)
      # an entry that holds nothing back fails.
      - name: Package check
        run: go run github.com/CharitonMedia/togavsu/cmd/togavsu-module check -installable -strict package
      - name: Image
        run: docker build -t togavsu-lawpay-docuseal:ci .
